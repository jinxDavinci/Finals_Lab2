<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Score Evaluator</title>
  <link rel="stylesheet" href="style.css">
  
</head>
<body>
  <main class="card">
    <h1>Score Evaluator</h1>
    <p class="subtitle">Enter your name and score to see your result.</p>

    <button id="startBtn" type="button">Start</button>

    <div id="result" class="result hidden" aria-live="polite">
      <p id="resultName"></p>
      <p id="resultScore"></p>
      <p id="resultRemark" class="remark"></p>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
